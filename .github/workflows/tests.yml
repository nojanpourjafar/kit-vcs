# Runs the test suite on every push and pull request, on macOS, Windows and
# Linux, with the oldest and newest Python versions Kit supports.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:    # adds a "Run workflow" button on the Actions tab

jobs:
  test:
    strategy:
      fail-fast: false  # let every system finish, so one failure shows where it happens
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install Kit and the test tools
        run: python -m pip install -e ".[dev,s3]" "moto[s3]"
      - name: Run the tests
        run: python -m pytest -q
