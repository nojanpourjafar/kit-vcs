# Builds the double-click app on macOS and Windows.
#
# Pushing a tag like v0.4.0 builds both apps and publishes them on a GitHub
# release. The "Run workflow" button on the Actions tab builds them without
# publishing anything, to try a build first; the zips then appear at the
# bottom of that run's page.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest      # Apple Silicon Macs
            zip: Kit-macOS.zip
          - os: windows-latest
            zip: Kit-Windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Kit, pywebview and PyInstaller
        run: python -m pip install -e ".[app]" pyinstaller
      - name: Build the app
        run: python packaging/build_app.py
      # ditto keeps the links inside a .app bundle, which a plain zip would break.
      - name: Zip Kit.app
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/Kit.app ${{ matrix.zip }}
      - name: Zip the Kit folder
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Kit -DestinationPath ${{ matrix.zip }}
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.zip }}
          path: ${{ matrix.zip }}

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')   # only for tags, not for test builds
    runs-on: ubuntu-latest
    permissions:
      contents: write                            # needed to create a release
    steps:
      - uses: actions/download-artifact@v6
        with:
          merge-multiple: true                   # both zips into the current folder
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" Kit-macOS.zip Kit-Windows.zip --repo "${{ github.repository }}" --title "Kit ${{ github.ref_name }}" --generate-notes
