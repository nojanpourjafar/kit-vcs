<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kit</title>
<style>
/* Colours are named once here and used everywhere below, so the dark theme
   only has to redefine these names. */
:root {
  --bg: #f4f5f7; --card: #ffffff; --ink: #16181d; --muted: #5d6672; --line: #d5dae1;
  --accent: #c2410c; --accent-ink: #ffffff;
  --added: #15803d; --modified: #b45309; --renamed: #1d4ed8; --removed: #b91c1c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101216; --card: #191c22; --ink: #e8eaee; --muted: #9aa3ae; --line: #323944;
    --accent: #fb923c; --accent-ink: #1a1206;
    --added: #4ade80; --modified: #fbbf24; --renamed: #93c5fd; --removed: #f87171;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
h1 { margin: 0; font-size: 22px; line-height: 1.25; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.section-head h2 { margin: 0; }
.section-tools { display: flex; align-items: center; gap: 8px; }
.section-tools .search { width: min(240px, 40vw); }
.star { padding: 4px 8px; font-size: 15px; line-height: 1; color: var(--muted); }
.star.on, button.only.on { color: var(--accent); border-color: var(--accent); }
button.only { padding: 5px 10px; font-size: 13px; white-space: nowrap; }
.search { width: min(260px, 50%); padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--card); }
.none { margin: 8px 0 0; }
.badge.named { color: var(--accent); text-transform: none; letter-spacing: 0; }
.names { margin: 10px 0 0; font-size: 13px; color: var(--muted); }
.names .badge button.link { margin-left: 4px; text-decoration: none; }
.row.inline { margin-top: 0; }
button.before { padding: 3px 9px; font-size: 12px; color: var(--modified); border-color: var(--modified); }
.sound.hearing-before button.before { background: var(--modified); color: var(--card); }
.name-line { margin: 10px 0 0; font-size: 13px; }
button.link { border: 0; padding: 0; background: none; color: var(--accent); font: inherit; text-decoration: underline; }
.meter { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin: 14px 0 4px; }
.meter div { height: 100%; background: var(--accent); transition: width .3s; }
#remote-label .sync { color: var(--accent); font-weight: 600; }
.stack { display: grid; gap: 12px; margin-top: 12px; }
.stack label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.stack .row { margin-top: 0; } .stack .row input { flex: 1; }
.conflicts { border-color: var(--modified); }
.conflict { display: grid; gap: 8px; margin-top: 14px; }
.conflict .sounds .sound { background: var(--bg); }
.sound.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
h2 { margin: 0 0 10px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
ul, ol { list-style: none; margin: 0; padding: 0; }
.muted { color: var(--muted); margin: 4px 0 0; }
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 10px 20px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--card); }
.brand { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600; }
#btn-home { font-size: 13px; font-weight: 400; padding: 4px 10px; margin-left: 6px; }
.kits { display: grid; gap: 8px; margin-top: 16px; }
.kit-row { display: flex; gap: 6px; align-items: stretch; }
.kits .open { display: grid; gap: 1px; flex: 1; min-width: 0; text-align: left; padding: 10px 14px; }
.kits .forget { padding: 0 12px; color: var(--muted); border-color: transparent; background: transparent; font-size: 18px; }
.kit-row:not(:hover) .forget:not(:focus-visible) { opacity: 0; }  /* shown on hover, and to the keyboard */
.kits .forget:hover { color: var(--ink); border-color: var(--line); }
.kits small { color: var(--muted); overflow-wrap: anywhere; }
.mark { font: 700 12px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .1em;
  text-transform: uppercase; color: var(--accent); }
.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px;
  max-width: 1180px; margin: 0 auto; padding: 24px 20px 64px; }
main { display: grid; gap: 24px; align-content: start; min-width: 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
.sounds { display: grid; gap: 8px; }
.sound { display: flex; align-items: center; gap: 14px; background: var(--card);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
.what { flex: 1; min-width: 0; }
.warn { margin-top: 14px; padding: 10px 14px; border-radius: 8px; font-size: 14px;
  border: 1px solid var(--modified); color: var(--modified); }
.warn ul { margin: 6px 0 0; padding-left: 18px; } .warn li { overflow-wrap: anywhere; }
.reveal { padding: 4px 9px; font-size: 14px; line-height: 1; color: var(--muted); }
.sound.draggable { cursor: grab; } .sound.draggable button { cursor: pointer; }
.name { font-weight: 600; overflow-wrap: anywhere; }
.info { color: var(--muted); font-size: 13px; }
.badge { display: inline-block; margin-left: 8px; padding: 1px 7px; border-radius: 999px;
  border: 1px solid currentColor; font-size: 11px; font-weight: 600; letter-spacing: .05em;
  text-transform: uppercase; vertical-align: 1px; }
.added { color: var(--added); } .modified { color: var(--modified); }
.renamed { color: var(--renamed); } .removed { color: var(--removed); }
.gone li { color: var(--muted); text-decoration: line-through; padding: 2px 0; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--card);
  border-radius: 8px; padding: 7px 14px; }
button:hover { border-color: var(--muted); }
button:disabled { opacity: .5; cursor: default; }
select { font: inherit; color: inherit; border: 1px solid var(--line); background: var(--card);
  border-radius: 8px; padding: 5px 8px; max-width: 100%; }
.compare { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 12px 0 0; color: var(--muted); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type=text] { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--bg);
  border-radius: 8px; padding: 7px 10px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.layout { grid-template-columns: 270px minmax(0, 1fr); }
#history { display: grid; gap: 4px; }
#history button { display: grid; gap: 1px; width: 100%; text-align: left; border-color: transparent;
  background: none; padding: 8px 10px; }
#history button:hover { background: var(--card); }
#history button.here { background: var(--card); border-color: var(--line); }
#history span { font-size: 13px; overflow-wrap: anywhere; }
#history small { color: var(--muted); font-size: 12px; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); max-width: min(560px, 90vw);
  background: var(--ink); color: var(--bg); border-radius: 10px; padding: 10px 16px;
  opacity: 0; pointer-events: none; transition: opacity .2s; }
#toast.show { opacity: 1; }
#toast.bad { background: var(--removed); color: #fff; }
.layout.single { grid-template-columns: minmax(0, 1fr); max-width: 760px; }
@media (max-width: 760px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.play { flex: none; width: 34px; height: 34px; padding: 0; border-radius: 50%;
  display: grid; place-items: center; }
/* The play triangle and the pause bars are drawn with borders, so no icon files are needed. */
.play::before { content: ""; margin-left: 3px; border-style: solid; border-width: 7px 0 7px 11px;
  border-color: transparent transparent transparent currentColor; }
.playing .play::before { margin: 0; width: 4px; height: 13px; border-width: 0 4px;
  border-color: currentColor; }
.wave { flex: none; position: relative; width: 240px; height: 44px; color: var(--accent); cursor: pointer; }
.wave svg { width: 100%; height: 100%; display: block; fill: currentColor; }
.wave.empty { color: var(--muted); font-size: 12px; display: grid; place-items: center; cursor: default; }
/* The playhead: a thin line whose position follows --progress (0 to 1), set from the script. */
.sound.playing .wave::after, .sound.started .wave::after { content: ""; position: absolute; top: 0; bottom: 0;
  width: 2px; background: var(--ink); left: calc(var(--progress, 0) * 100%); }
@media (max-width: 760px) { .wave { width: 120px; } }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
#remote-label { color: var(--muted); font-size: 13px; max-width: 320px; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
#remote-form { display: flex; gap: 10px; padding: 12px 20px; border-bottom: 1px solid var(--line); }
[hidden] { display: none !important; }  /* `hidden` must win over display: flex and grid */
.split { display: flex; height: 12px; border-radius: 999px; overflow: hidden; gap: 2px; margin-bottom: 10px; }
.split span { background: var(--accent); }
.split span:nth-child(2n) { background: var(--renamed); }
.split span:nth-child(3n) { background: var(--added); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 14px; }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark">Kit</span><span id="kit-name"></span>
    <button id="btn-home" hidden>All kits</button></div>
  <div class="actions" hidden>
    <span id="remote-label"></span>
    <button id="btn-remote">Shared folder</button>
    <button id="btn-pull">Pull</button>
    <button id="btn-push">Push</button>
  </div>
</header>
<form id="remote-form" hidden>
  <input type="text" id="remote-input" aria-label="Shared folder" placeholder="A shared folder, like ~/GoogleDrive/my-kit, or s3://bucket/my-kit">
  <button type="button" class="pick" id="remote-pick">Choose…</button>
  <button class="primary" id="remote-save">Save</button>
</form>
<div class="layout">
  <aside><h2>History</h2><ol id="history"></ol></aside>
  <main id="main"></main>
</div>
<div id="toast" role="status"></div>
<script>
// The server writes a random token into this page. Every request sends it
// back, which is how the server knows the request came from this page.
const TOKEN = "__KIT_TOKEN__";
const DEV = __KIT_DEV__;  // true when started with --dev (make dev)

const $ = (selector) => document.querySelector(selector);

// Build an element: h("li", {class: "sound"}, "text", otherElement).
// Text is added as text, never as HTML, so a file name cannot inject markup.
function h(tag, props = {}, ...children) {
  const el = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (key === "class") el.className = value;
    else if (key.startsWith("on")) el.addEventListener(key.slice(2), value);
    else if (value !== null && value !== undefined && value !== false) el.setAttribute(key, value);
  }
  for (const child of children.flat()) {
    if (child !== null && child !== undefined && child !== false) el.append(child);
  }
  return el;
}

// Call the server. With a body it is a POST (an action), without one a GET.
async function api(path, body) {
  const response = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: {"X-Kit-Token": TOKEN, "Content-Type": "application/json"},
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || "Something went wrong");
  return data;
}

let state = null;   // the latest answer from /api/state
let view = "now";
let against = null;  // the version the open one is compared with; null means the one before it
let draft = "";

const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
const when = (time) => new Date(time).toLocaleString([], {dateStyle: "medium", timeStyle: "short"});

function summary(changes) {
  const counts = {};
  for (const change of changes) counts[change.kind] = (counts[change.kind] || 0) + 1;
  return Object.entries(counts).map(([kind, n]) => `${n} ${kind}`).join(", ");
}

// ---- one sound ------------------------------------------------------------

// `live` is true for sounds that are in the folder right now (the "Now" screen),
// as opposed to a sound inside an old version, which only exists in .kit.
function soundRow(sound, live) {
  const info = [sound.label || (sound.by ? `added by ${sound.by} in ${sound.since}` : "not saved yet")];
  if (sound.was) info.push(`was ${sound.was}`);
  if (sound.bpm) info.push(`${sound.bpm} BPM`);
  if (sound.key) info.push(sound.key);
  if (sound.info) info.push(sound.info);
  const row = h("li", {class: sound.path === selected ? "sound selected" : "sound", "data-path": sound.path,
    "data-search": searchText(sound), "data-key": (sound.key || "").toLowerCase(),
    onclick: () => select(row)});
  row.append(playButton(row, sound));
  if (sound.before) {
    // A modified sound: play its previous audio, at the same point, to hear what changed.
    row.append(h("button", {class: "before", title: "Play the previous version of this sound, from the same point",
      "aria-label": `Play ${sound.path} as it was before`, onclick: () => toggle(row, sound, "before")}, "Before"));
  }
  row.append(h("div", {class: "what"},
    h("div", {class: "name"}, sound.path,
      sound.change && h("span", {class: `badge ${sound.change}`}, sound.change)),
    h("div", {class: "info"}, info.join(" · "))));
  row.append(waveBox(row, sound));
  if (live) {
    row.dataset.starred = sound.starred ? "1" : "";
    row.append(h("button", {class: sound.starred ? "star on" : "star", "aria-pressed": String(Boolean(sound.starred)),
      title: "Star this sound (S). Stars are yours alone: they are never pushed.",
      "aria-label": `Star ${sound.path}`, onclick: () => star(row, sound)}, sound.starred ? "★" : "☆"));
    row.append(h("button", {class: "reveal", title: state.reveal, "aria-label": `${state.reveal}: ${sound.path}`,
      onclick: (event) => act("reveal", {path: sound.path}, event.currentTarget)}, "↗"));
    dragOut(row, sound);
  }
  return row;
}

// In the desktop app (macOS and Windows), a sound can be dragged out of the window
// into FL Studio. A web page cannot hand a real file to another program, so once the
// mouse has moved a few pixels with the button held down, the page asks Python
// to start a native drag, the kind Finder starts. Buttons and the waveform keep
// their own clicks.
function dragOut(row, sound) {
  if (!inDesktopApp() || !window.pywebview.api.drag_sound) return;
  row.classList.add("draggable");
  row.title = "Drag into FL Studio or any other app";
  row.addEventListener("mousedown", (down) => {
    if (down.button !== 0 || down.target.closest("button, .wave")) return;
    down.preventDefault();  // no text selection while dragging
    const move = (event) => {
      if (Math.hypot(event.clientX - down.clientX, event.clientY - down.clientY) < 5) return;
      stop();
      window.pywebview.api.drag_sound(sound.path).catch((error) => toast(error.message, true));
    };
    const stop = () => {
      removeEventListener("mousemove", move);
      removeEventListener("mouseup", stop);
    };
    addEventListener("mousemove", move);
    addEventListener("mouseup", stop);
  });
}

function soundSection(title, sounds, live = false) {
  const list = h("ul", {class: live ? "sounds live" : "sounds"}, sounds.map((sound) => soundRow(sound, live)));
  const none = h("p", {class: "muted none", hidden: true});
  if (sounds.length < 2) return h("section", {}, h("h2", {}, title), list);
  const box = h("input", {type: "search", class: "search", value: search, "aria-label": "Search sounds",
    placeholder: "Search sounds  ( / )", oninput: () => { search = box.value; filter(list, none); },
    onkeydown: (event) => {
      if (event.key === "Escape") { box.value = search = ""; filter(list, none); box.blur(); }
    }});
  const tools = h("div", {class: "section-tools"}, box);
  if (live) {
    // Show only the starred sounds. Stars belong to the folder as it is now, so
    // this is on the "Now" screen only.
    const only = h("button", {class: starredOnly ? "only on" : "only", "aria-pressed": String(starredOnly),
      title: "Show only starred sounds", onclick: () => {
        starredOnly = !starredOnly;
        only.classList.toggle("on", starredOnly);
        only.setAttribute("aria-pressed", String(starredOnly));
        filter(list, none);
      }}, "★ Starred");
    tools.prepend(only);
  }
  filter(list, none);
  return h("section", {}, h("div", {class: "section-head"}, h("h2", {}, title), tools), list, none);
}

// Star or unstar a sound. Only the row changes: redrawing the whole screen
// would interrupt a sound that is playing.
async function star(row, sound) {
  const on = row.dataset.starred !== "1";
  try {
    await api("/api/star", {path: sound.path, on});
  } catch (error) {
    return toast(error.message, true);
  }
  sound.starred = on;  // so a redraw from the same state keeps it
  row.dataset.starred = on ? "1" : "";
  const button = row.querySelector(".star");
  button.classList.toggle("on", on);
  button.setAttribute("aria-pressed", String(on));
  button.textContent = on ? "★" : "☆";
  const none = row.closest("section").querySelector(".none");
  if (none && starredOnly) filter(row.parentElement, none);  // an unstarred sound leaves the list
}

// ---- search ---------------------------------------------------------------

// What is typed in the search box. Kept outside the box because the screen is
// redrawn often (after a save, when the window comes back into focus), and a
// new box starts empty; this way the search survives the redraw.
let search = "";
let starredOnly = false;  // the "★ Starred" button on the "Now" screen

// What the search looks through for one sound: its path, plus its tempo and key
// written the ways people type them, so "140", "140bpm", "f#m" and "f# minor"
// all find "Dark Loop 140bpm F#m.wav".
function searchText(sound) {
  const words = [sound.path];
  if (sound.bpm) words.push(`${sound.bpm}`, `${sound.bpm}bpm`);
  if (sound.key) {
    const [note, mode] = sound.key.split(" ");  // "F#", "min"
    const long = mode === "min" ? "minor" : "major";
    words.push(`${note}${mode}`, `${note} ${mode}`, `${note} ${long}`, `${note}${long}`);
    if (mode === "min") words.push(`${note}m`);
  }
  return words.join(" | ").toLowerCase();
}

// Hide the rows that do not match. Every word typed must appear somewhere in
// the sound's search text, in any order and any case: "kick 808" finds "808s/Kick 808.wav".
// Rows are hidden, not removed, so playing and waveforms carry on untouched.
// A key typed into the search: "a minor", "F# min", "Cmaj", "ebm". It is matched
// as a whole against each sound's key, or "a minor" would find "F# minor" through
// the separate words "a" and "minor". Short forms like "am" are not treated as
// keys, because they are just as likely to be part of a name ("sample").
const KEY_QUERY = /(?:^|\s)([a-g])(#|b)?\s?(minor|min|major|maj)(?=\s|$)|(?:^|\s)([a-g])(#|b)m(?=\s|$)/;

function filter(list, none) {
  let text = search.toLowerCase();
  let key = null;
  const match = text.match(KEY_QUERY);
  if (match) {
    const [, note, sign, mode, shortNote, shortSign] = match;
    key = note ? `${note}${sign || ""} ${mode.startsWith("maj") ? "maj" : "min"}` : `${shortNote}${shortSign} min`;
    text = text.replace(match[0], " ");
  }
  const words = text.split(/\s+/).filter(Boolean);
  const onlyStars = starredOnly && list.classList.contains("live");
  let shown = 0;
  for (const row of list.children) {
    row.hidden = !(words.every((word) => row.dataset.search.includes(word)) && (!key || row.dataset.key === key)
      && (!onlyStars || row.dataset.starred === "1"));
    if (!row.hidden) shown++;
  }
  none.hidden = shown > 0;
  none.textContent = !onlyStars ? `No sounds match "${search}".`
    : search.trim() ? `No starred sounds match "${search}".`
    : "No starred sounds yet. Click ☆ on a sound, or choose one and press S.";
}

// ---- keyboard ---------------------------------------------------------------

// /  jump to the search box (as on GitHub)      Esc  clear the search
// ↑ ↓  choose a sound                            Space  play or pause it
// Enter in the search box  play the first match  S  star or unstar it

// The chosen sound's path. Kept outside the rows, like `search`, so the choice
// survives the screen being redrawn.
let selected = null;

// The rows the search has not hidden, top to bottom.
const visibleRows = () => [...document.querySelectorAll(".sounds .sound")].filter((row) => !row.hidden);

function select(row) {
  for (const other of document.querySelectorAll(".sound.selected")) other.classList.remove("selected");
  selected = row ? row.dataset.path : null;
  if (row) {
    row.classList.add("selected");
    row.scrollIntoView({block: "nearest"});  // scroll only if it is off screen
  }
}

// Move the choice up (-1) or down (+1), stopping at the ends of the list.
function move(step) {
  const rows = visibleRows();
  if (!rows.length) return;
  const at = rows.findIndex((row) => row.dataset.path === selected);
  const next = at === -1 ? (step > 0 ? 0 : rows.length - 1) : Math.min(rows.length - 1, Math.max(0, at + step));
  select(rows[next]);
}

const play = (row) => row.querySelector(".play").click();  // the same as clicking its play button

document.addEventListener("keydown", (event) => {
  const typing = event.target.closest("input, textarea");  // keys there belong to the text
  const inSearch = event.target.classList.contains("search");
  if (event.key === "/" && !typing) {
    const box = $(".search");
    if (box) { event.preventDefault(); box.focus(); box.select(); }
  } else if ((event.key === "ArrowDown" || event.key === "ArrowUp") && (!typing || inSearch)) {
    event.preventDefault();  // otherwise the arrows also scroll the page
    if (inSearch) event.target.blur();
    move(event.key === "ArrowDown" ? 1 : -1);
  } else if (event.key === " " && !typing && !event.target.closest("button")) {
    // A focused button already reacts to Space on its own, so leave those alone.
    const row = visibleRows().find((candidate) => candidate.dataset.path === selected);
    if (row) { event.preventDefault(); play(row); }
  } else if (event.key === "Enter" && inSearch) {
    const row = visibleRows()[0];
    if (row) { select(row); play(row); }
  } else if (event.key.toLowerCase() === "s" && !typing && !event.metaKey && !event.ctrlKey && !event.altKey) {
    const row = visibleRows().find((candidate) => candidate.dataset.path === selected);
    if (row && row.querySelector(".star")) row.querySelector(".star").click();  // only on the "Now" screen
  }
});

function removedSection(title, paths) {
  if (!paths.length) return null;
  return h("section", {}, h("h2", {}, title), h("ul", {class: "gone"}, paths.map((p) => h("li", {}, p))));
}

// ---- the "Now" screen: the folder as it is ---------------------------------

function renderNow() {
  const latest = state.versions[0];
  const count = state.changes.length;
  const box = h("section", {class: "card"});
  if (count) {
    box.append(h("h1", {}, plural(count, "unsaved change")), h("p", {class: "muted"}, summary(state.changes)));
    box.append(saveForm());
  } else {
    box.append(h("h1", {}, latest ? `Everything is saved in ${latest.label}` : "Nothing saved yet"));
    if (latest) box.append(h("div", {class: "row"}, exportButton(latest.id, latest.label)));
    if (!state.sounds.length) {
      box.append(h("p", {class: "muted"}, "Add some sounds to this folder and they will show up here."));
    }
  }
  if (state.warnings.length) {
    box.append(h("div", {class: "warn"},
      h("strong", {}, "These names will not work for someone on Windows. Rename them before sharing:"),
      h("ul", {}, state.warnings.map((line) => h("li", {}, line)))));
  }
  const parts = [conflictSection(), box, soundSection(`${plural(state.sounds.length, "sound")} in the folder`, state.sounds, true),
    removedSection(latest ? `Removed since ${latest.label}` : "Removed", state.removed)];
  parts.push(splitSection(state.sounds));
  $("#main").replaceChildren(...parts.filter(Boolean));
}

// Give a version a name ("1.0", "Sold on BeatStars"). The button opens into a box.
function nameButton(version) {
  const button = h("button", {type: "button", onclick: () => {
    const input = h("input", {type: "text", "aria-label": "Name for this version", placeholder: "1.0 or Sold on BeatStars"});
    button.replaceWith(h("form", {class: "row inline", onsubmit: (event) => {
      event.preventDefault();
      act("name-version", {version: version.id, name: input.value}, event.submitter);
    }}, input, h("button", {class: "primary"}, "Name it")));
    input.focus();
  }}, "Name this version");
  return button;
}

// Save a version as a plain zip in Downloads, for people who do not use Kit.
function exportButton(id, label) {
  return h("button", {onclick: (event) => act("export", {version: id}, event.currentTarget)},
    `Export ${label} as zip`);
}

// ---- sounds both sides changed ---------------------------------------------

// After a pull, a sound that you and someone else both changed is there twice:
// yours under its own name, theirs beside it as "name (from Lucas).wav". Each
// pair is shown here with both versions playable, and a choice.
function conflictSection() {
  if (!state.conflicts.length) return null;
  const byPath = Object.fromEntries(state.sounds.map((sound) => [sound.path, sound]));
  return h("section", {class: "card conflicts"},
    h("h1", {}, state.conflicts.length === 1 ? "A sound was changed on both sides"
      : `${state.conflicts.length} sounds were changed on both sides`),
    h("p", {class: "muted"}, "Listen to both versions, then choose which to keep."),
    state.conflicts.map((conflict) => {
      const mine = byPath[conflict.path], theirs = byPath[conflict.theirs];
      const choose = (keep) => (event) => act("resolve", {path: conflict.path, keep}, event.currentTarget);
      return h("div", {class: "conflict"},
        h("ul", {class: "sounds"},
          mine && soundRow({...mine, label: "your version"}, false),
          theirs && soundRow({...theirs, label: `${conflict.author}'s version`}, false)),
        h("div", {class: "row"},
          h("button", {onclick: choose("mine")}, "Keep mine"),
          h("button", {onclick: choose("theirs")}, `Keep ${conflict.author}'s`),
          h("button", {onclick: choose("both")}, "Keep both")));
    }));
}

function renderStart() {
  const box = h("section", {class: "card"},
    h("h1", {}, `${state.name} is not tracked by Kit yet`),
    h("p", {class: "muted"}, state.folder));
  const author = h("input", {type: "text", id: "author", "aria-label": "Your producer name", value: state.author});
  box.append(h("form", {class: "row", onsubmit: (event) => {
    event.preventDefault();
    act("init", {author: author.value}, event.submitter);
  }}, author, h("button", {class: "primary"}, "Start tracking this folder")));
  $("#main").replaceChildren(box);
}

// ---- the home screen: pick a kit --------------------------------------------

// Inside the desktop app, Python adds `window.pywebview.api` to the page. Its
// pick_folder() shows the system's own folder chooser. A browser cannot hand a
// web page a folder's full path, so there the path is typed in.
const inDesktopApp = () => Boolean(window.pywebview && window.pywebview.api);

// Fill a text box from the system's folder chooser (desktop app only).
async function pickInto(input) {
  const folder = await window.pywebview.api.pick_folder();
  if (folder) input.value = folder;
}

// A text box for a folder, with a Choose… button next to it in the desktop app.
function folderField(label, placeholder, value = "") {
  const input = h("input", {type: "text", "aria-label": label, placeholder, value});
  const field = h("div", {class: "row"}, input);
  if (inDesktopApp()) field.append(h("button", {type: "button", onclick: () => pickInto(input)}, "Choose…"));
  return {field, input};
}

// Get a kit someone shared with you: the folder they push to (Google Drive,
// Dropbox, a USB stick), and where to put your copy.
function sharedKitCard() {
  const from = folderField("Shared folder", "The folder it was shared in, like ~/Google Drive/kits/dark-trap");
  const into = folderField("Put it in", "Where to put your copy, like ~/Music", "~/Music");
  return h("section", {class: "card"},
    h("h1", {}, "Get a shared kit"),
    h("p", {class: "muted"}, "A kit someone pushed to a shared folder. Kit copies every version and keeps it in sync."),
    h("form", {class: "stack", onsubmit: (event) => {
      event.preventDefault();
      act("clone", {remote: from.input.value, into: into.input.value}, event.submitter);
    }}, h("label", {}, "Shared folder", from.field), h("label", {}, "Put it in", into.field),
      h("div", {class: "row"}, h("button", {class: "primary"}, "Get the kit"))));
}

function renderHome() {
  const box = h("section", {class: "card"}, h("h1", {}, "Your kits"));
  if (state.recent.length) {
    box.append(h("div", {class: "kits"}, state.recent.map((kit) =>
      h("div", {class: "kit-row"},
        h("button", {class: "open", onclick: (event) => act("open", {folder: kit.folder}, event.currentTarget)},
          h("strong", {}, kit.name), h("small", {}, kit.folder)),
        // Only the list entry goes: the folder and its .kit history stay on disk.
        h("button", {class: "forget", title: "Remove from this list (the folder is not deleted)",
          "aria-label": `Remove ${kit.name} from the list`,
          onclick: (event) => act("forget", {folder: kit.folder}, event.currentTarget)}, "×")))));
  } else {
    box.append(h("p", {class: "muted"}, "No kits yet. Open a folder of sounds to start."));
  }
  box.append(nameLine(`Your sounds are credited to ${state.name}`));
  if (inDesktopApp()) {
    box.append(h("div", {class: "row"}, h("button", {class: "primary", onclick: async (event) => {
      const folder = await window.pywebview.api.pick_folder();
      if (folder) act("open", {folder}, event.target);
    }}, "Open a folder…")));
  } else {
    const path = h("input", {type: "text", "aria-label": "Folder path",
      placeholder: "Path of a kit folder, like ~/Music/MyDrumKit"});
    box.append(h("form", {class: "row", onsubmit: (event) => {
      event.preventDefault();
      act("open", {folder: path.value}, event.submitter);
    }}, path, h("button", {class: "primary"}, "Open folder")));
  }
  $("#main").replaceChildren(box, sharedKitCard());
}

function render() {
  const home = Boolean(state.home);
  document.title = home ? "Kit" : `${state.name} · Kit`;
  $("#kit-name").textContent = home ? "" : state.name;
  $("#btn-home").hidden = home;
  $("aside").hidden = home || !state.repo;
  $(".layout").classList.toggle("single", home || !state.repo);
  $(".actions").hidden = home || !state.repo;
  $("#remote-pick").hidden = !inDesktopApp();
  if (home) {
    view = "now";                       // the next kit opens on its current state,
    $("#remote-form").hidden = true;    // with nothing left over from this one
    $("#remote-input").value = "";
    return renderHome();
  }
  if (!state.repo) return renderStart();
  renderHistory();
  if (view !== "now") return renderVersion(view);
  renderRemote();
  renderNow();
}

async function refresh() {
  // The first time a big kit is opened, every file is read, which can take a
  // while. If the answer is slow, show how far along the reading is.
  const watching = setTimeout(() => showProgress(watching), 400);
  try {
    state = await api("/api/state");
    render();
  } catch (error) {
    $("#main").replaceChildren(h("p", {class: "muted"}, error.message));
  } finally {
    clearTimeout(watching);
    reading = null;
  }
}

let reading = null;  // the timer asking for progress while a scan runs

async function showProgress(started) {
  reading = started;
  while (reading === started) {
    try {
      const p = await api("/api/progress");
      if (reading !== started) break;
      if (p.files_total && p.files < p.files_total) {
        const percent = Math.floor(p.bytes * 100 / Math.max(1, p.bytes_total));
        $("#main").replaceChildren(h("section", {class: "card"},
          h("h1", {}, "Reading your kit"),
          h("p", {class: "muted"}, "Kit reads every file the first time, so later opens are instant."),
          h("div", {class: "meter"}, h("div", {style: `width: ${percent}%`})),
          h("p", {class: "muted"}, `${p.files.toLocaleString()} of ${p.files_total.toLocaleString()} files · ` +
            `${size(p.bytes)} of ${size(p.bytes_total)}`)));
      }
    } catch (error) { /* try again */ }
    await new Promise((resolve) => setTimeout(resolve, 300));
  }
}

function size(bytes) {
  const units = ["bytes", "KB", "MB", "GB"];
  let i = 0;
  while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
  return i ? `${bytes.toFixed(1)} ${units[i]}` : `${bytes} bytes`;
}

// ---- actions: save, restore, start ------------------------------------------

function toast(text, bad = false) {
  const el = $("#toast");
  el.textContent = text;
  el.className = bad ? "show bad" : "show";
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { el.className = ""; }, bad ? 7000 : 4000);
}

// Run an action on the server, show what it said, then redraw from fresh state.
// Actions that leave the folder as it was keep you on the screen you are on;
// the others (saving, restoring, pulling...) go back to the folder as it is now.
const STAY = new Set(["name-version", "unname", "export", "reveal"]);

async function act(name, body, button) {
  if (button) button.disabled = true;
  try {
    const result = await api(`/api/${name}`, body || {});
    if (result.message) toast(result.message);
    if (!STAY.has(name)) view = "now";
    if (name === "commit") draft = "";
    await refresh();
    return true;
  } catch (error) {
    toast(error.message, true);
    return false;
  } finally {
    if (button) button.disabled = false;
  }
}

function saveForm() {
  // `draft` keeps what was typed, because the page redraws when the window regains focus.
  const message = h("input", {type: "text", "aria-label": "What changed",
    placeholder: "What changed? For example: added 5 hats", value: draft,
    oninput: (event) => { draft = event.target.value; }});
  return h("div", {},
    h("form", {class: "row", onsubmit: (event) => {
      event.preventDefault();
      act("commit", {message: message.value}, event.submitter);
    }}, message, h("button", {class: "primary"}, "Save version")),
    nameLine(`Saving as ${state.author}`));
}

// "Saving as Nojan · Change": a small line that opens into a box to change the
// producer name that new versions are credited to.
function nameLine(text) {
  const line = h("p", {class: "muted name-line"}, text, " · ");
  line.append(h("button", {class: "link", type: "button", onclick: () => {
    const input = h("input", {type: "text", "aria-label": "Producer name", value: state.author || state.name});
    line.replaceChildren(h("form", {class: "row", onsubmit: (event) => {
      event.preventDefault();
      act("name", {name: input.value}, event.submitter);
    }}, input, h("button", {class: "primary"}, "Save name")));
    input.focus();
    input.select();
  }}, "Change"));
  return line;
}

// ---- history and saved versions ----------------------------------------------

function historyItem(id, label, text, sub, names = []) {
  return h("li", {}, h("button", {class: view === id ? "here" : "", onclick: () => { view = id; against = null; render(); }},
    h("strong", {}, label, names.map((name) => h("span", {class: "badge named"}, name))),
    h("span", {}, text), sub && h("small", {}, sub)));
}

function renderHistory() {
  const count = state.changes.length;
  $("#history").replaceChildren(
    historyItem("now", "Now", count ? plural(count, "unsaved change") : "everything saved"),
    ...state.versions.map((v) => historyItem(v.id, v.label, `${v.author}: ${v.message}`, when(v.time), v.names)));
}

async function renderVersion(id) {
  let version;
  try {
    version = await api(`/api/version?ref=${id}${against ? `&against=${against}` : ""}`);
  } catch (error) {
    toast(error.message, true);
    view = "now";
    return render();
  }
  if (view !== id) return;  // another version was clicked while this one loaded
  const box = h("section", {class: "card"},
    h("h1", {}, `${version.label}: ${version.message}`),
    h("p", {class: "muted"},
      `${version.author} · ${when(version.time)} · ${plural(version.sounds.length, "sound")}`));
  const buttons = h("div", {class: "row"});
  if (!version.latest) {
    buttons.append(h("button", {class: "primary",
      onclick: (event) => act("restore", {version: version.id}, event.currentTarget)},
      `Put the folder back to ${version.label}`));
  }
  buttons.append(exportButton(version.id, version.names[0] || version.label));
  buttons.append(nameButton(version));
  box.append(buttons);
  box.append(compareLine(version, id));
  if (version.names.length) {
    box.append(h("p", {class: "names"}, "Named ", version.names.map((name) =>
      h("span", {class: "badge named"}, name, h("button", {class: "link", title: `Remove the name ${name}`,
        "aria-label": `Remove the name ${name}`, onclick: (event) => act("unname", {name}, event.currentTarget)}, "×")))));
  }
  const since = version.against ? `since ${version.against.label}` : `in ${version.label}`;
  $("#main").replaceChildren(...[box, soundSection(`Sounds in ${version.label}`, version.sounds),
    removedSection(`Removed ${since}`, version.removed)].filter(Boolean));
}

// "Compared with [v3, the version before] · 2 added, 1 modified". Picking an
// older version shows everything that changed since then, as one set of
// changes: the badges, the removed list and the Before buttons all follow it.
// So "what's different since the kit I sent last week?" is one click.
function compareLine(version, id) {
  if (!version.against) return h("p", {class: "compare"}, "The first version: every sound is new");
  const at = state.versions.findIndex((v) => v.id === version.id);
  const older = state.versions.slice(at + 1);
  const what = summary(version.changes) || "no changes";
  if (older.length < 2) return h("p", {class: "compare"}, `Compared with ${version.against.label} · ${what}`);
  const choice = h("select", {"aria-label": "Compare with", onchange: () => {
    against = choice.value === older[0].id ? null : choice.value;
    renderVersion(id);
  }}, older.map((v, i) => h("option", {value: v.id, selected: v.id === version.against.id},
    i === 0 ? `${v.label}, the version before` : `${v.label}: ${v.message}`)));
  return h("div", {class: "compare"}, "Compared with", choice, `· ${what}`);
}

// ---- sound: one shared player, and waveforms drawn on demand --------------------

const player = new Audio();
let current = null;  // the row that is playing or paused

function playButton(row, sound) {
  return h("button", {class: "play", "aria-label": `Play ${sound.path}`, onclick: () => toggle(row, sound)});
}

// `which` is "after" (the sound as it is) or "before" (a modified sound's
// previous audio). Switching between the two on the same row keeps the
// playback position, so the change can be heard back and forth.
function toggle(row, sound, which = "after") {
  if (current === row && row.dataset.which === which) {
    if (player.paused) player.play(); else player.pause();
    return;
  }
  const at = current === row ? player.currentTime : 0;
  if (current && current !== row) current.classList.remove("playing", "started", "hearing-before");
  current = row;
  row.dataset.which = which;
  row.classList.toggle("hearing-before", which === "before");
  if (!at) row.style.setProperty("--progress", 0);
  row.classList.add("started");
  // An <audio> request cannot carry our header, so the token rides in the address.
  player.src = `/api/audio?${which === "before" ? sound.before : sound.source}&t=${TOKEN}`;
  if (at) {
    player.addEventListener("loadedmetadata", () => { player.currentTime = Math.min(at, player.duration || at); },
      {once: true});
  }
  player.play().catch(() => toast("The browser cannot play this kind of file.", true));
}

player.addEventListener("play", () => current && current.classList.add("playing"));
player.addEventListener("pause", () => current && current.classList.remove("playing"));
player.addEventListener("ended", () => current && current.classList.remove("started"));
player.addEventListener("timeupdate", () => {
  if (current && player.duration) current.style.setProperty("--progress", player.currentTime / player.duration);
});

// A waveform is only fetched when its row scrolls near the screen, so a kit
// with a thousand sounds does not read a thousand files up front.
const nearScreen = new IntersectionObserver((entries) => {
  for (const entry of entries) {
    if (!entry.isIntersecting) continue;
    nearScreen.unobserve(entry.target);
    entry.target.load();
  }
}, {rootMargin: "300px"});

function waveBox(row, sound) {
  const box = h("div", {class: "wave", onclick: (event) => seek(row, sound, event)});
  box.dataset.source = sound.source;
  box.load = () => {  // called once the row is near the screen
    drawWave(box);
    if (!sound.bpm) listen(row, sound);
  };
  nearScreen.observe(box);
  return box;
}

// A sound with no tempo in its name is listened to in the background. A loop
// gets a tempo, shown as "≈140 BPM" because it is an estimate (when it is off,
// it is most often by half or double). A one-shot with no key in its name gets
// the note it plays, shown as "≈F#", so an 808 can be matched to the song.
async function listen(row, sound) {
  let heard = null;
  try {
    heard = await api(`/api/tempo?${sound.source}`);
  } catch (error) {
    return;
  }
  if (!row.isConnected) return;  // the screen was redrawn meanwhile
  const info = row.querySelector(".info");
  if (heard.bpm) {
    const shown = Math.round(heard.bpm);
    info.append(` · ≈${shown} BPM`);
    row.dataset.search += ` | ${shown} | ${shown}bpm`;
  } else if (heard.note && !sound.key) {
    info.append(` · ≈${heard.note}`);
    row.dataset.search += ` | ${heard.note.toLowerCase()}`;
  } else {
    return;  // nothing clear to show
  }
  const none = row.closest("section").querySelector(".none");
  if (none) filter(row.parentElement, none);  // it may match the search now
}

async function drawWave(box) {
  let peaks = null;
  try {
    peaks = (await api(`/api/peaks?${box.dataset.source}`)).peaks;
  } catch (error) { /* leave it empty */ }
  if (!peaks || !peaks.length) {
    box.classList.add("empty");
    box.textContent = "no waveform";
    return;
  }
  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("viewBox", "0 0 240 44");
  svg.setAttribute("preserveAspectRatio", "none");
  const step = 240 / peaks.length;
  peaks.forEach((level, i) => {
    const bar = document.createElementNS(svgNS, "rect");  // one bar per slice, mirrored around the middle
    bar.setAttribute("x", i * step);
    bar.setAttribute("y", 22 - Math.max(level * 20, 0.6));
    bar.setAttribute("width", Math.max(step - 0.8, 0.6));
    bar.setAttribute("height", Math.max(level * 40, 1.2));
    svg.append(bar);
  });
  box.append(svg);
}

// Clicking a waveform starts that sound and jumps to the clicked position.
function seek(row, sound, event) {
  const box = event.currentTarget;
  if (box.classList.contains("empty")) return;
  const share = (event.clientX - box.getBoundingClientRect().left) / box.offsetWidth;
  if (current !== row) toggle(row, sound);
  const jump = () => { if (player.duration) player.currentTime = share * player.duration; };
  if (player.readyState >= 1) jump(); else player.addEventListener("loadedmetadata", jump, {once: true});
}

// ---- sharing: remote, push, pull, and who added what ------------------------------

function renderRemote() {
  const label = $("#remote-label");
  label.textContent = state.remote ? `Shared in ${state.remote.split(/[\\/]/).pop()}` : "Not shared yet";
  label.title = state.remote || "";
  // What there is to sync: "2 to push", "1 new from Lucas". The button with
  // something to do is highlighted.
  const sync = state.sync;
  const notes = [];
  if (sync && sync.ahead) notes.push(`${sync.ahead} to push`);
  if (sync && sync.behind) notes.push(`${sync.behind} new from ${sync.from.join(" and ")}`);
  if (notes.length) label.append(h("span", {class: "sync"}, ` · ${notes.join(" · ")}`));
  $("#btn-pull").classList.toggle("primary", Boolean(sync && sync.behind));
  $("#btn-push").classList.toggle("primary", Boolean(sync && sync.ahead && !sync.behind));
  if (!$("#remote-input").value) $("#remote-input").value = state.remote || "";
}

$("#btn-remote").addEventListener("click", () => { $("#remote-form").hidden = !$("#remote-form").hidden; });
$("#remote-pick").addEventListener("click", () => pickInto($("#remote-input")));
$("#remote-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  if (await act("remote", {remote: $("#remote-input").value}, $("#remote-save"))) $("#remote-form").hidden = true;
});
$("#btn-push").addEventListener("click", (event) => act("push", {}, event.currentTarget));
$("#btn-pull").addEventListener("click", (event) => act("pull", {}, event.currentTarget));

function splitSection(sounds) {
  const counts = {};
  for (const sound of sounds) {
    const who = sound.by || "not saved yet";
    counts[who] = (counts[who] || 0) + 1;
  }
  const people = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  if (people.length < 2) return null;  // a split of one person says nothing
  return h("section", {class: "card"}, h("h2", {}, "Who added what"),
    h("div", {class: "split"}, people.map(([who, n]) => h("span", {style: `flex-grow: ${n}`, title: who}))),
    h("div", {class: "legend"}, people.map(([who, n]) =>
      h("span", {}, `${who} ${Math.round(n * 100 / sounds.length)}% (${n})`))));
}

$("#btn-home").addEventListener("click", (event) => act("close", {}, event.currentTarget));

// The desktop app announces when its Python bridge is ready; redraw so the
// home screen can swap the path box for the "Open a folder…" button.
window.addEventListener("pywebviewready", () => { if (state) render(); });

// Coming back to this window redraws it, so sounds added in Finder show up.
window.addEventListener("focus", refresh);

// ---- development: reload when ui.html is saved ------------------------------

// With --dev, the page asks the server once a second when ui.html was last
// saved, and reloads itself when that changes. The open kit stays open, because
// the server remembers it. Changes to Python files still need a restart.
if (DEV) {
  let saved = null;
  setInterval(async () => {
    try {
      const {page} = await api("/api/dev");
      if (saved !== null && page !== saved) location.reload();
      saved = page;
    } catch (error) {
      // The server is restarting or busy; ask again next second.
    }
  }, 1000);
}
refresh();
</script>
</body>
</html>
