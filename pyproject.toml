[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kit-vcs"
version = "0.15.0"
description = "Kit: Git-style version control for sample packs and loop kits"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
s3 = ["boto3>=1.28"]
app = ["pywebview>=5"]

[project.scripts]
kit = "kit.cli:main"

[project.gui-scripts]
kit-app = "kit.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kit = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
